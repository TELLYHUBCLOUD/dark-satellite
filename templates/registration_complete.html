<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Complete - Dark Satellite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <div class="bg-stellar"></div>

    <div class="glass-panel animate-slide-up" style="max-width: 500px; padding: 60px; text-align: center;">
        <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 30px; border: 1px solid var(--success); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);">
            <i class="fas fa-id-card"></i>
        </div>

        <h1 style="margin-bottom: 10px;">Identity <span class="text-gradient">Secured</span></h1>
        <p style="color: var(--text-dim); margin-bottom: 40px;">Registration successful. Your credentials have been initialized.</p>

        <div style="background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border-glass); padding: 25px; border-radius: 20px; margin-bottom: 40px; cursor: pointer; position: relative;" onclick="copyRoll()">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin: 0 0 10px;">YOUR UNIQUE ROLL NUMBER</p>
            <div id="roll-text" class="text-gradient" style="font-size: 2.5rem; font-weight: 900; letter-spacing: 4px;">{{ student.roll_number }}</div>
            <div id="copy-status" style="font-size: 0.75rem; color: var(--success); margin-top: 10px; opacity: 0; transition: opacity 0.3s;"><i class="fas fa-check"></i> Copied to Clipboard</div>
        </div>

        <div style="text-align: left; background: rgba(0, 210, 255, 0.05); padding: 20px; border-radius: 16px; margin-bottom: 40px;">
            <p style="font-size: 0.85rem; color: var(--text-bright); margin: 0;"><i class="fas fa-info-circle" style="color: var(--primary);"></i> <strong>Important:</strong> Please save this roll number. It is required for all future logins and to access your results.</p>
        </div>

        <a href="{{ url_for('login_page') }}" class="btn btn-primary btn-glow" style="width: 100%;">Proceed to Portal Access</a>
    </div>

    <script>
        function copyRoll() {
            const roll = document.getElementById('roll-text').innerText;
            navigator.clipboard.writeText(roll).then(() => {
                const status = document.getElementById('copy-status');
                status.style.opacity = 1;
                setTimeout(() => status.style.opacity = 0, 2000);
            });
        }
    </script>
</body>

</html>
