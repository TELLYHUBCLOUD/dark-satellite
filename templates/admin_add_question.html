<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Management - Dark Satellite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .admin-sidebar { background: var(--bg-surface); border-right: 1px solid var(--border-glass); padding: 30px; }
        .admin-main { padding: 40px; }
        .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: 600; transition: var(--transit); }
        .tab-btn.active { background: rgba(0, 210, 255, 0.1); color: var(--primary); }
    </style>
</head>

<body>
    <div class="bg-stellar"></div>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div style="margin-bottom: 50px;">
                <h2 class="text-gradient" style="font-size: 1.5rem;">SATELLITE <span style="color: white;">OS</span></h2>
            </div>
            <nav style="display: flex; flex-direction: column; gap: 10px;">
                <a href="/admin/dashboard" class="btn btn-outline" style="justify-content: flex-start; border: none;"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/admin/add_question" class="btn btn-outline" style="justify-content: flex-start; border: none; background: rgba(0, 210, 255, 0.1); color: var(--primary);"><i class="fas fa-plus-circle"></i> Add Questions</a>
                <a href="/admin/reset_exam" class="btn btn-outline" style="justify-content: flex-start; border: none;"><i class="fas fa-undo"></i> Reset Exam</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div style="max-width: 800px; margin: 0 auto;">
                <h1 style="margin-bottom: 30px;">Question <span class="text-gradient">Repository</span></h1>
                
                <div class="glass-panel" style="padding: 40px;">
                    <div style="display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px;">
                        <button class="tab-btn active" onclick="switchTab('single')">Single Entry</button>
                        <button class="tab-btn" onclick="switchTab('bulk')">Bulk Import (CSV)</button>
                    </div>

                    <div id="single-tab" class="tab-content">
                        <form id="addQuestionForm">
                            <div class="form-group">
                                <label style="font-size: 0.8rem; color: var(--text-muted);">Question Text</label>
                                <input type="text" id="question" class="form-input" required>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group"><label style="font-size: 0.8rem; color: var(--text-muted);">Option A</label><input type="text" id="optionA" class="form-input" required></div>
                                <div class="form-group"><label style="font-size: 0.8rem; color: var(--text-muted);">Option B</label><input type="text" id="optionB" class="form-input" required></div>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group"><label style="font-size: 0.8rem; color: var(--text-muted);">Option C</label><input type="text" id="optionC" class="form-input" required></div>
                                <div class="form-group"><label style="font-size: 0.8rem; color: var(--text-muted);">Option D</label><input type="text" id="optionD" class="form-input" required></div>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group">
                                    <label style="font-size: 0.8rem; color: var(--text-muted);">Correct Index</label>
                                    <select id="correct" class="form-input" style="background: var(--bg-surface);"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                                </div>
                                <div class="form-group"><label style="font-size: 0.8rem; color: var(--text-muted);">Domain / Subject</label><input type="text" id="subject" class="form-input" required></div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-glow" style="width: 100%; margin-top: 20px;">Inject into Repository</button>
                        </form>
                    </div>

                    <div id="bulk-tab" class="tab-content" style="display: none; text-align: center;">
                        <p style="color: var(--text-dim); margin-bottom: 30px;">Upload a standard CSV schema to bulk populate the repository.</p>
                        <a href="/api/admin/sample_csv" class="btn btn-outline" style="margin-bottom: 40px;"><i class="fas fa-file-csv"></i> Download Schema Template</a>
                        <form id="uploadForm">
                            <input type="file" id="csvFile" accept=".csv" required style="display: none;">
                            <label for="csvFile" class="glass-panel" style="display: block; padding: 40px; border: 2px dashed var(--border-glass); cursor: pointer; transition: var(--transit);">
                                <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
                                <p id="file-name">Select or Drop CSV File</p>
                            </label>
                            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 30px;">Execute Bulk Import</button>
                        </form>
                        <div id="uploadStatus" style="margin-top: 20px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('single-tab').style.display = tab === 'single' ? 'block' : 'none';
            document.getElementById('bulk-tab').style.display = tab === 'bulk' ? 'block' : 'none';
            event.target.classList.add('active');
        }

        document.getElementById('csvFile').onchange = e => {
            document.getElementById('file-name').innerText = e.target.files[0].name;
        };

        // Reuse existing functional logic from original template
        document.getElementById('addQuestionForm').onsubmit = async (e) => {
            e.preventDefault();
            const question = document.getElementById('question').value;
            const options = [document.getElementById('optionA').value, document.getElementById('optionB').value, document.getElementById('optionC').value, document.getElementById('optionD').value];
            const correct = document.getElementById('correct').value;
            const subject = document.getElementById('subject').value;
            const res = await fetch('/api/admin/questions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, options, correct, subject})});
            const data = await res.json();
            if(data.success) { alert('Succeeded'); e.target.reset(); }
        };

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', document.getElementById('csvFile').files[0]);
            const status = document.getElementById('uploadStatus');
            status.innerHTML = '<span style="color:var(--primary)">Processing...</span>';
            const res = await fetch('/api/admin/upload_questions', {method:'POST', body:formData});
            const data = await res.json();
            if(data.success) status.innerHTML = `<span style="color:var(--success)">${data.count} Questions Injected</span>`;
            else status.innerHTML = `<span style="color:var(--error)">Failed: ${data.message}</span>`;
        };
    </script>
</body>

</html>
