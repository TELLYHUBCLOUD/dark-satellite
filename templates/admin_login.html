<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication - Dark Satellite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #020617;
            margin: 0;
        }
        .admin-login-card {
            width: 100%;
            max-width: 450px;
            padding: 50px;
            text-align: center;
        }
        .admin-logo {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }
        .btn-admin-primary {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }
        .btn-admin-primary:hover {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="bg-stellar" style="opacity: 0.5;"></div>

    <div class="glass-panel admin-login-card animate-slide-up">
        <div class="admin-logo">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2 style="margin-bottom: 10px;">Security <span style="color: #ef4444;">Override</span></h2>
        <p style="color: var(--text-dim); margin-bottom: 40px; font-size: 0.9rem;">Administrative authorization required.</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <input type="text" id="username" class="form-input" placeholder="Credential ID" required style="border-color: rgba(239, 68, 68, 0.1);">
            </div>
            <div class="form-group">
                <input type="password" id="password" class="form-input" placeholder="Security Key" required style="border-color: rgba(239, 68, 68, 0.1);">
            </div>
            <button type="submit" class="btn btn-admin-primary" style="width: 100%; margin-top: 20px;">Authorize Entry</button>
        </form>

        <a href="/" class="btn btn-outline" style="width: 100%; margin-top: 20px; border: none; font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Exit to Surface</a>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Verifying...';
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.message);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Connection failure.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
