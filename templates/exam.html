<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Exam - {{ subject }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            overflow: hidden;
        }
        .exam-sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--border-glass);
            height: 100vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .main-exam-area {
            height: 100vh;
            overflow-y: auto;
            padding: 40px;
        }
        .question-number-badge {
            background: var(--grad-stellar);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="bg-stellar"></div>

    <div style="display: grid; grid-template-columns: 350px 1fr; height: 100vh;">
        <!-- Sidebar -->
        <aside class="exam-sidebar">
            <div style="text-align: center; margin-bottom: 40px;">
                <div style="width: 70px; height: 70px; border-radius: 50%; background: var(--grad-stellar); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: white; box-shadow: var(--shadow-neon);">
                    {{ student_name[0] | upper }}
                </div>
                <h3 style="margin: 0;">{{ student_name }}</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Subject: {{ subject }}</p>
            </div>

            <div style="flex: 1;">
                <h4 style="margin-bottom: 20px; font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;">Question Palette</h4>
                <div class="palette-grid" id="palette">
                    <!-- JS Generated -->
                </div>
            </div>

            <div style="margin-top: 30px;">
                <div class="glass-panel" style="padding: 15px; margin-bottom: 20px;">
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase;">Time Remaining</p>
                    <div id="timer" class="text-gradient" style="font-size: 1.8rem; font-weight: 800; font-family: monospace;">00:00:00</div>
                </div>
                <button onclick="submitExam()" class="btn btn-secondary" style="width: 100%;"><i class="fas fa-paper-plane"></i> Finish & Submit</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-exam-area">
            <div style="max-width: 900px; margin: 0 auto;">
                <div class="glass-panel question-card" id="question-container">
                    <div id="q-number-box">
                        <span class="question-number-badge" id="q-idx-label">QUESTION 1</span>
                    </div>
                    <h2 id="q-text" style="line-height: 1.5; margin-bottom: 40px; min-height: 80px;">Loading assessment...</h2>

                    <div style="display: flex; flex-direction: column; gap: 15px;" id="options-area">
                        <!-- JS Generated -->
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--border-glass);">
                        <button id="btn-prev" onclick="navQuestion(-1)" class="btn btn-outline"><i class="fas fa-chevron-left"></i> Previous</button>
                        <button id="btn-next" onclick="navQuestion(1)" class="btn btn-primary">Next Question <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: center; gap: 40px; color: var(--text-muted); font-size: 0.85rem;">
                    <span><i class="fas fa-keyboard"></i> Use arrow keys for navigation</span>
                    <span><i class="fas fa-eye"></i> Proctored Session Active</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Submit Loader -->
    <div id="submit-overlay" style="position: fixed; inset: 0; background: var(--bg-deep); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;">
        <div style="width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <h2 style="margin-top: 30px;" class="text-gradient">Securing Your Answers...</h2>
        <p style="color: var(--text-dim);">Please do not close this window.</p>
    </div>

    <script>
        let questions = [];
        let currentIdx = 0;
        let savedAnswers = {};
        let timeLeft = {{ duration * 60 }};
        let timerInterval;

        window.onload = async function() {
            try {
                const subject = "{{ subject }}";
                const res = await fetch(`/api/start_exam/${encodeURIComponent(subject)}`, { method: 'POST' });
                const data = await res.json();

                if (data.success) {
                    questions = data.questions;
                    savedAnswers = data.saved_answers || {};
                    timeLeft = data.remaining_time;
                    initPalette();
                    loadQuestion(0);
                    startTimer();
                } else {
                    alert(data.message);
                    if (data.redirect) window.location.href = data.redirect;
                }
            } catch (e) {
                alert("Failed to initialize exam environment.");
            }
        };

        function startTimer() {
            const display = document.getElementById('timer');
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSubmit();
                    return;
                }
                timeLeft--;
                const h = Math.floor(timeLeft / 3600);
                const m = Math.floor((timeLeft % 3600) / 60);
                const s = timeLeft % 60;
                display.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                if (timeLeft < 300) display.style.color = 'var(--error)';
            }, 1000);
        }

        function initPalette() {
            const palette = document.getElementById('palette');
            palette.innerHTML = '';
            questions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = `palette-item ${savedAnswers[q.id] ? 'answered' : ''}`;
                item.textContent = idx + 1;
                item.id = `palette-${idx}`;
                item.onclick = () => loadQuestion(idx);
                palette.appendChild(item);
            });
        }

        function loadQuestion(idx) {
            if (idx < 0 || idx >= questions.length) return;
            currentIdx = idx;
            const q = questions[idx];
            
            document.getElementById('q-idx-label').textContent = `QUESTION ${idx + 1}`;
            document.getElementById('q-text').textContent = q.question;
            
            renderOptions(q);
            
            // Update Palette
            document.querySelectorAll('.palette-item').forEach((el, i) => {
                el.classList.remove('current');
                if (i === idx) el.classList.add('current');
            });

            document.getElementById('btn-prev').disabled = idx === 0;
            const nextBtn = document.getElementById('btn-next');
            if (idx === questions.length - 1) {
                nextBtn.innerHTML = 'Review & Finish <i class="fas fa-check-double"></i>';
                nextBtn.onclick = submitExam;
            } else {
                nextBtn.innerHTML = 'Next Question <i class="fas fa-chevron-right"></i>';
                nextBtn.onclick = () => navQuestion(1);
            }
        }

        function renderOptions(q) {
            const container = document.getElementById('options-area');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const box = document.createElement('div');
                box.className = `option-box ${savedAnswers[q.id] === opt ? 'selected' : ''}`;
                box.innerHTML = `
                    <div style="width: 24px; height: 24px; border: 2px solid var(--border-glass); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800;">${String.fromCharCode(65+i)}</div>
                    <span>${opt}</span>
                `;
                box.onclick = () => selectOption(q.id, opt);
                container.appendChild(box);
            });
        }

        async function selectOption(qId, answer) {
            savedAnswers[qId] = answer;
            renderOptions(questions[currentIdx]);
            
            const pItem = document.getElementById(`palette-${currentIdx}`);
            if (pItem) pItem.classList.add('answered');

            try {
                await fetch('/api/save_answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question_id: qId, answer: answer })
                });
            } catch (e) {}
        }

        function navQuestion(dir) { loadQuestion(currentIdx + dir); }

        function autoSubmit() {
            alert("Time is up! Your exam is being submitted automatically.");
            submitExam(true);
        }

        async function submitExam(force = false) {
            if (!force && !confirm("Are you sure you want to finish the assessment?")) return;

            const overlay = document.getElementById('submit-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = 1, 10);

            try {
                const res = await fetch('/api/submit_exam', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.message);
                    overlay.style.display = 'none';
                }
            } catch (e) {
                alert("Submission failed. Network error.");
                overlay.style.display = 'none';
            }
        }

        // Key navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') navQuestion(1);
            if (e.key === 'ArrowLeft') navQuestion(-1);
        });
    </script>
</body>

</html>
