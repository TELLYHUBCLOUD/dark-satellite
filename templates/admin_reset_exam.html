<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Assessment - Dark Satellite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .admin-sidebar { background: var(--bg-surface); border-right: 1px solid var(--border-glass); padding: 30px; }
        .admin-main { padding: 40px; }
    </style>
</head>

<body>
    <div class="bg-stellar"></div>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div style="margin-bottom: 50px;">
                <h2 class="text-gradient" style="font-size: 1.5rem;">SATELLITE <span style="color: white;">OS</span></h2>
            </div>
            <nav style="display: flex; flex-direction: column; gap: 10px;">
                <a href="/admin/dashboard" class="btn btn-outline" style="justify-content: flex-start; border: none;"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="/admin/add_question" class="btn btn-outline" style="justify-content: flex-start; border: none;"><i class="fas fa-plus-circle"></i> Add Questions</a>
                <a href="/admin/reset_exam" class="btn btn-outline" style="justify-content: flex-start; border: none; background: rgba(0, 210, 255, 0.1); color: var(--primary);"><i class="fas fa-undo"></i> Reset Exam</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div style="max-width: 600px; margin: 0 auto;">
                <h1 style="margin-bottom: 30px;">Reset <span class="text-gradient">Session</span></h1>
                
                <div class="glass-panel" style="padding: 40px;">
                    <p style="color: var(--text-dim); margin-bottom: 30px;">Authorize a candidate to re-initialize an assessment session.</p>

                    <form id="resetExamForm">
                        <div class="form-group">
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Candidate Roll Number</label>
                            <input type="text" id="resetRoll" class="form-input" required placeholder="e.g. OL20250001">
                        </div>
                        <div class="form-group">
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Domain / Subject</label>
                            <select id="resetSubject" class="form-input" required style="background: var(--bg-surface);">
                                <option value="" disabled selected>Select Subject</option>
                                <option value="Python">Python</option>
                                <option value="Web Design">Web Design</option>
                                <option value="IoT">IoT</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-secondary btn-glow" style="width: 100%; margin-top: 20px;">Execute Reset Sequence</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('resetExamForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const student_roll = document.getElementById('resetRoll').value;
            const subject = document.getElementById('resetSubject').value;
            if (!confirm(`Confirm reset for candidate ${student_roll}?`)) return;

            try {
                const response = await fetch('/api/admin/reset_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_roll, subject })
                });
                const data = await response.json();
                if (data.success) {
                    alert('Session reset successfully.');
                    e.target.reset();
                } else { alert('Error: ' + data.message); }
            } catch (error) { alert('Request failed.'); }
        });
    </script>
</body>

</html>
