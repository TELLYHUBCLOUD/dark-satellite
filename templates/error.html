<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error - Dark Satellite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-stellar"></div>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="glass-panel animate-slide-up" style="max-width: 500px; text-align: center; padding: 60px;">
            <div style="font-size: 5rem; margin-bottom: 20px; color: var(--error); filter: drop-shadow(0 0 20px rgba(255, 71, 87, 0.4));">
                <i class="fas fa-radiation-alt"></i>
            </div>
            <h2 style="color: var(--error); margin-bottom: 15px;">Anomaly Detected</h2>
            <p style="color: var(--text-dim); margin-bottom: 40px; line-height: 1.6;">
                {{ message }}
            </p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <a href="/" class="btn btn-primary btn-glow">Recalibrate (Home)</a>
                <button onclick="window.history.back()" class="btn btn-outline" style="border: none; color: var(--text-muted);">Back to Previous Sector</button>
            </div>
        </div>
    </div>
</body>

</html>
