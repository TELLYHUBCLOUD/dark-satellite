<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Project Ravi Kumar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-deep);
            margin: 0;
        }

        .auth-side {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .auth-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            background: var(--grad-stellar);
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .auth-container.right-panel-active .auth-overlay {
            transform: translateX(-100%);
        }

        .auth-form-side {
            width: 50%;
            height: 100%;
            position: absolute;
            top: 0;
            transition: all 0.6s ease-in-out;
            background: var(--bg-surface);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-side {
            left: 0;
            z-index: 5;
        }

        .register-side {
            left: 0;
            opacity: 0;
            z-index: 1;
        }

        .auth-container.right-panel-active .login-side {
            transform: translateX(100%);
            opacity: 0;
        }

        .auth-container.right-panel-active .register-side {
            transform: translateX(100%);
            opacity: 1;
            z-index: 6;
        }

        .alert-msg {
            font-size: 0.9rem;
            margin-top: 15px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="bg-stellar"></div>

    <div class="glass-panel auth-container {{ 'right-panel-active' if active_panel == 'register' else '' }}"
        id="container">

        <!-- Login Side -->
        <div class="auth-form-side login-side">
            <form id="loginForm">
                <h2 style="margin-bottom: 30px;">Access <span class="text-gradient">Portal</span></h2>
                <div class="form-group">
                    <input type="text" id="login-roll" class="form-input" placeholder="Roll Number" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" class="form-input" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="date" id="login-dob" class="form-input" required style="color-scheme: dark;">
                </div>
                <button type="submit" class="btn btn-primary btn-glow" style="width: 100%;">Sign In</button>
                <div id="login-alert" class="alert-msg"></div>
            </form>
        </div>

        <!-- Register Side -->
        <div class="auth-form-side register-side">
            <form id="registerForm">
                <h2 style="margin-bottom: 25px;">Create <span class="text-gradient">Account</span></h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <input type="text" id="reg-name" class="form-input" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="reg-email" class="form-input" placeholder="Email" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <input type="tel" id="reg-phone" class="form-input" placeholder="Phone" required>
                    </div>
                    <div class="form-group">
                        <input type="date" id="reg-dob" class="form-input" required style="color-scheme: dark;">
                    </div>
                </div>
                <div class="form-group">
                    <select id="reg-subject" class="form-input" required style="background-color: var(--bg-surface);">
                        <option value="" disabled selected>Select Subject</option>
                        <option value="Python">Python</option>
                        <option value="Web Design">Web Design</option>
                        <option value="IoT">IoT</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="password" id="reg-password" class="form-input" placeholder="Password" required
                        minlength="6">
                </div>
                <button type="submit" class="btn btn-secondary" style="width: 100%;">Initialize Identity</button>
                <div id="reg-alert" class="alert-msg"></div>
            </form>
        </div>

        <!-- Overlay -->
        <div class="auth-overlay">
            <div id="overlay-login-content">
                <h1>Hello, Candidate!</h1>
                <p style="margin: 20px 0 30px; opacity: 0.9;">Start your futuristic assessment journey by creating an
                    account.</p>
                <button class="btn btn-outline" id="signUp" style="border-color: white; color: white;">Sign Up</button>
            </div>
            <div id="overlay-register-content" style="display: none;">
                <h1>Welcome Back!</h1>
                <p style="margin: 20px 0 30px; opacity: 0.9;">Please log in with your credentials to access your
                    dashboard.</p>
                <button class="btn btn-outline" id="signIn" style="border-color: white; color: white;">Sign In</button>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');
        const overlayLogin = document.getElementById('overlay-login-content');
        const overlayRegister = document.getElementById('overlay-register-content');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
            overlayLogin.style.display = 'none';
            overlayRegister.style.display = 'block';
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
            overlayLogin.style.display = 'block';
            overlayRegister.style.display = 'none';
        });

        // Register Logic
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('reg-alert');
            alert.textContent = 'Processing...';
            alert.style.color = 'var(--info)';

            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const dob = document.getElementById('reg-dob').value;
            const subject = document.getElementById('reg-subject').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, dob, subject, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert.textContent = `Success! Roll: ${data.roll_number}`;
                    alert.style.color = 'var(--success)';
                    setTimeout(() => {
                        window.location.href = `/registration_complete/${data.roll_number}`;
                    }, 1500);
                } else {
                    alert.textContent = data.message;
                    alert.style.color = 'var(--error)';
                }
            } catch (err) {
                alert.textContent = 'Error: ' + err.message;
                alert.style.color = 'var(--error)';
            }
        });

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('login-alert');
            alert.textContent = 'Verifying...';
            alert.style.color = 'var(--info)';

            const roll_number = document.getElementById('login-roll').value;
            const password = document.getElementById('login-password').value;
            const dob = document.getElementById('login-dob').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roll_number, password, dob })
                });
                const data = await res.json();
                if (data.success) {
                    alert.textContent = 'Identity Confirmed!';
                    alert.style.color = 'var(--success)';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    alert.textContent = data.message;
                    alert.style.color = 'var(--error)';
                }
            } catch (err) {
                alert.textContent = 'Error: ' + err.message;
                alert.style.color = 'var(--error)';
            }
        });
    </script>
</body>

</html>
